# SWD adapter via the PRU-ICSS of an AM335x BeagleBone (driver: pruswd).
#
# Requires: /dev/gpiomem provided by the whitelist mmap module in
# contrib/pru-swd/gpiomem/, the PRU firmware at the path below (built
# from contrib/pru-swd/firmware/), and PRU0 left to this driver
# (remoteproc0 must be offline).  See contrib/pru-swd/README.md.

adapter driver pruswd
transport select swd

# 300 kHz is a safe start; the driver tops out at 1 MHz.
adapter speed 300

# Default firmware path (override before "init" if different):
# pruswd firmware /lib/firmware/pru-swd.bin
